<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ user.full_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <a href="/" class="btn btn-secondary mb-4">← Назад к списку</a>

    <div class="card">
        <div class="row g-0">
            <div class="col-md-4 text-center p-4">
                <img src="{{ user.photo_url }}" alt="avatar" class="img-fluid rounded-circle" style="max-height: 100px;">
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <h3 class="card-title">{{ user.full_name }}</h3>
                    <p class="card-text"><strong>Email:</strong> {{ user.email }}</p>
                    <p class="card-text"><strong>Телефон:</strong> {{ user.phone }}</p>
                    <p class="card-text"><strong>Пол:</strong>
                        {% if user.gender == 'male' %}
                            Мужской
                        {% else %}
                            Женский
                        {% endif %}
                    </p>
                    <p class="card-text"><strong>Город:</strong> {{ user.location }}</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
