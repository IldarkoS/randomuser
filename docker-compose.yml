version: '3.9'

services:
  psql:
    image: postgres:17
    container_name: psql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    env_file:
      - .env

  fastapi:
    build: .
    container_name: fastapi
    restart: always
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - psql
    env_file:
      - .env